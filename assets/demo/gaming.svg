<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- 公式デモデスク①：ゲーミング｜PC + Nintendo Switch 2 -->
  <!-- 写真ではなくイラスト。scripts/publishDemoDesks.ts が JPEG に焼いて公開デスクの写真として載せる -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101A2E"/>
      <stop offset="100%" stop-color="#070C16"/>
    </linearGradient>
    <radialGradient id="wallGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12304A"/>
      <stop offset="100%" stop-color="#0A1826"/>
    </linearGradient>
    <linearGradient id="screenWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="100%" stop-color="#120C08"/>
    </linearGradient>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A3826"/>
      <stop offset="100%" stop-color="#2A1F14"/>
    </linearGradient>
    <linearGradient id="barLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .lbl   { font-family: "Yu Gothic UI","Meiryo","Segoe UI",sans-serif; font-size: 21px; fill: #93A3BC; }
      .lead  { stroke: #475569; stroke-width: 1.5; fill: none; }
      .dot   { fill: #F97316; }
      .title { font-family: "Yu Gothic UI","Meiryo","Segoe UI",sans-serif; font-size: 46px; font-weight: 700; fill: #F1F5F9; }
      .sub   { font-family: "Yu Gothic UI","Meiryo","Segoe UI",sans-serif; font-size: 24px; fill: #6B7C93; }
      .badge { font-family: "Segoe UI",sans-serif; font-size: 18px; font-weight: 700; fill: #F97316; letter-spacing: 2px; }
      .case  { fill: #1B2536; stroke: #33415A; stroke-width: 2; }
      .bezel { fill: #161E2C; stroke: #33415A; stroke-width: 2.5; }
      .cable { fill: none; stroke: #F97316; stroke-width: 3; stroke-opacity: 0.55; stroke-linecap: round; }
      .pcbl  { fill: none; stroke: #64748B; stroke-width: 3; stroke-opacity: 0.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#wallGlow)"/>

  <!-- 壁のグリッド -->
  <g stroke="#1B2740" stroke-width="1" opacity="0.6">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600"/>
    <path d="M200 0V660M400 0V660M600 0V660M800 0V660M1000 0V660M1200 0V660M1400 0V660"/>
  </g>

  <!-- 床 -->
  <rect x="0" y="928" width="1600" height="72" fill="#0A101C"/>
  <path d="M0 928H1600" stroke="#1E293B" stroke-width="2"/>

  <!-- モニターアーム（Ergotron LX デュアルスタッキング） -->
  <g>
    <rect x="784" y="360" width="20" height="292" rx="6" fill="#212C3E" stroke="#3A4A63" stroke-width="2"/>
    <rect x="560" y="404" width="240" height="14" rx="7" fill="#212C3E" stroke="#3A4A63" stroke-width="2"/>
    <rect x="792" y="438" width="230" height="14" rx="7" fill="#212C3E" stroke="#3A4A63" stroke-width="2"/>
    <rect x="768" y="636" width="52" height="20" rx="6" fill="#2A3548"/>
  </g>

  <!-- メインモニター 27" OLED -->
  <g>
    <rect x="418" y="296" width="486" height="284" rx="12" class="bezel"/>
    <rect x="432" y="310" width="458" height="248" rx="6" fill="url(#screen)"/>
    <!-- ゲーム画面のあたり -->
    <g opacity="0.55">
      <path d="M432 470h458v88H432z" fill="#0E2438"/>
      <circle cx="661" cy="410" r="46" fill="#1D4E6B" opacity="0.8"/>
      <path d="M560 500l60-52 54 40 70-64 86 76" stroke="#2E7FA8" stroke-width="4" fill="none"/>
    </g>
    <rect x="432" y="310" width="458" height="248" rx="6" fill="none" stroke="#1F2C3E"/>
  </g>

  <!-- サブモニター 27" 4K（Switch 2 と PC が入力を分け合う） -->
  <g>
    <rect x="1014" y="316" width="404" height="240" rx="12" class="bezel"/>
    <rect x="1027" y="329" width="378" height="206" rx="6" fill="url(#screenWarm)"/>
    <g opacity="0.5">
      <rect x="1058" y="358" width="150" height="14" rx="7" fill="#7C4A1E"/>
      <rect x="1058" y="388" width="240" height="10" rx="5" fill="#4B3018"/>
      <rect x="1058" y="412" width="196" height="10" rx="5" fill="#4B3018"/>
      <rect x="1058" y="450" width="316" height="60" rx="8" fill="#3A2510"/>
    </g>
  </g>

  <!-- モニターライト（ScreenBar Halo） -->
  <g>
    <rect x="548" y="278" width="226" height="16" rx="8" fill="#232E40" stroke="#3A4A63" stroke-width="2"/>
    <path d="M548 296h226l52 90H496z" fill="url(#barLight)"/>
  </g>

  <!-- デスク（FLEXISPOT E7） -->
  <g>
    <rect x="96" y="650" width="1408" height="28" rx="6" fill="url(#deskTop)"/>
    <rect x="96" y="650" width="1408" height="6" rx="3" fill="#61492F" opacity="0.8"/>
    <rect x="236" y="678" width="40" height="250" fill="#1A2334"/>
    <rect x="1322" y="678" width="40" height="250" fill="#1A2334"/>
    <rect x="200" y="918" width="112" height="14" rx="6" fill="#212C3E"/>
    <rect x="1286" y="918" width="112" height="14" rx="6" fill="#212C3E"/>
  </g>

  <!-- スピーカー（Yamaha HS5 ステレオペア） -->
  <g>
    <rect x="212" y="500" width="104" height="150" rx="8" class="case"/>
    <circle cx="264" cy="580" r="30" fill="#0E1622" stroke="#3E4E68" stroke-width="3"/>
    <circle cx="264" cy="530" r="11" fill="#0E1622" stroke="#3E4E68" stroke-width="2"/>
    <rect x="1440" y="500" width="104" height="150" rx="8" class="case"/>
    <circle cx="1492" cy="580" r="30" fill="#0E1622" stroke="#3E4E68" stroke-width="3"/>
    <circle cx="1492" cy="530" r="11" fill="#0E1622" stroke="#3E4E68" stroke-width="2"/>
  </g>

  <!-- Nintendo Switch 2 + Dock（サブモニターの下、デスクの上に置く） -->
  <g>
    <!-- 本体（ドックに挿さっている） -->
    <rect x="1128" y="576" width="168" height="60" rx="7" fill="#131C2B" stroke="#3A4A63" stroke-width="2.5"/>
    <rect x="1152" y="584" width="120" height="44" rx="4" fill="#16344A"/>
    <rect x="1128" y="576" width="24" height="60" rx="7" fill="#1E4A6B"/>
    <rect x="1272" y="576" width="24" height="60" rx="7" fill="#B4262B" opacity="0.85"/>
    <!-- ドック -->
    <path d="M1120 636h184l-9 14h-166z" fill="#1B2536" stroke="#3A4A63" stroke-width="2"/>
  </g>

  <!-- キーボード（Keychron Q1 Pro） -->
  <g>
    <path d="M604 612h330l16 38H588z" fill="#222D3E" stroke="#3A4A63" stroke-width="2"/>
    <g fill="#38455C">
      <rect x="614" y="620" width="300" height="7" rx="3"/>
      <rect x="610" y="631" width="308" height="7" rx="3"/>
      <rect x="606" y="642" width="316" height="6" rx="3"/>
    </g>
  </g>

  <!-- マウス（G Pro X Superlight 2・無線） -->
  <path d="M986 616c22 0 36 14 36 32s-14 24-36 24-36-6-36-24 14-32 36-32z" fill="#222D3E" stroke="#3A4A63" stroke-width="2"/>
  <path d="M986 616v22" stroke="#3A4A63" stroke-width="2"/>

  <!-- ヘッドセット（HyperX Cloud Alpha Wireless） -->
  <g>
    <path d="M330 596a52 52 0 0 1 104 0" fill="none" stroke="#3A4A63" stroke-width="9" stroke-linecap="round"/>
    <rect x="316" y="592" width="30" height="52" rx="12" fill="#222D3E" stroke="#3A4A63" stroke-width="2"/>
    <rect x="418" y="592" width="30" height="52" rx="12" fill="#222D3E" stroke="#3A4A63" stroke-width="2"/>
  </g>

  <!-- スマートフォン -->
  <g>
    <rect x="488" y="586" width="46" height="64" rx="7" fill="#1B2536" stroke="#3A4A63" stroke-width="2"/>
    <rect x="494" y="592" width="34" height="52" rx="4" fill="#0F1B2A"/>
  </g>

  <!-- デスク下：PC / 電源タップ / 充電器 -->
  <g>
    <rect x="330" y="690" width="150" height="238" rx="10" class="case"/>
    <rect x="348" y="712" width="114" height="52" rx="5" fill="#0F1826"/>
    <circle cx="405" cy="806" r="34" fill="#0F1826" stroke="#F97316" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="405" cy="806" r="15" fill="#F97316" fill-opacity="0.35"/>
    <rect x="348" y="878" width="114" height="8" rx="4" fill="#33415A"/>

    <rect x="900" y="854" width="286" height="42" rx="8" class="case"/>
    <g fill="#0F1826">
      <rect x="918" y="866" width="26" height="18" rx="3"/>
      <rect x="954" y="866" width="26" height="18" rx="3"/>
      <rect x="990" y="866" width="26" height="18" rx="3"/>
      <rect x="1026" y="866" width="26" height="18" rx="3"/>
      <rect x="1062" y="866" width="26" height="18" rx="3"/>
      <rect x="1098" y="866" width="26" height="18" rx="3"/>
      <rect x="1134" y="866" width="26" height="18" rx="3"/>
    </g>

    <rect x="1224" y="850" width="86" height="50" rx="10" class="case"/>
    <rect x="1240" y="866" width="16" height="10" rx="3" fill="#0F1826"/>
    <rect x="1266" y="866" width="16" height="10" rx="3" fill="#0F1826"/>
  </g>

  <!-- 配線（デスク下を這わせて電源タップへ集約する） -->
  <g class="cable">
    <path d="M480 900h404"/>
    <path d="M1186 876c46 0 52-6 60-14"/>
    <path d="M1132 854c40-52 96-70 152-76"/>
    <path d="M1044 854c0-56 30-88 84-96"/>
    <path d="M960 854c-40-48-84-70-140-76"/>
  </g>

  <!-- ラベル -->
  <g>
    <path class="lead" d="M418 330H310"/><circle class="dot" cx="418" cy="330" r="4"/>
    <text class="lbl" x="112" y="336">27" OLED 240Hz</text>

    <path class="lead" d="M1418 316v-24"/><circle class="dot" cx="1418" cy="316" r="4"/>
    <text class="lbl" x="1418" y="278" text-anchor="end">27" 4K（PC と Switch 2 で共用）</text>

    <path class="lead" d="M1212 636v52h172"/><circle class="dot" cx="1212" cy="636" r="4"/>
    <text class="lbl" x="1390" y="695">Switch 2 + Dock</text>

    <path class="lead" d="M330 800H214"/><circle class="dot" cx="330" cy="800" r="4"/>
    <text class="lbl" x="112" y="770">ゲーミングPC</text>

    <path class="lead" d="M1043 854v-52h122"/><circle class="dot" cx="1043" cy="854" r="4"/>
    <text class="lbl" x="1172" y="808">電源タップ 10口</text>
  </g>

  <!-- タイトル -->
  <g>
    <rect x="96" y="86" width="86" height="30" rx="6" fill="#F97316" fill-opacity="0.14" stroke="#F97316" stroke-opacity="0.5"/>
    <text class="badge" x="112" y="107">DEMO</text>
    <text class="title" x="96" y="176">ゲーミング｜PC + Switch 2</text>
    <text class="sub" x="98" y="216">1台のデスクに2つの映像ソース</text>
  </g>
</svg>
